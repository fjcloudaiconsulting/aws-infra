---
# Ported from terraform/platform/node-init.sh.tftpl (the Lightsail node's first-boot script).

# 2 GB swap. Under kubelet's default NoSwap behaviour pods do not use it; it absorbs memory
# pressure from k3s itself and the OS, so the kernel does not OOM-kill the control plane.
- name: Create the swap file, readable by root only
  ansible.builtin.shell: fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
  args:
    creates: /swapfile

- name: Enable swap at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Read the active swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: node_base_swaps
  changed_when: false
  check_mode: false

- name: Enable swap now
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in node_base_swaps.stdout_lines"
  changed_when: true

# Security updates only (the Ubuntu default origins), no automatic reboot: a reboot restarts
# the databases, so it stays a deliberate act.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Run unattended-upgrades daily, never rebooting
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

# Key-only SSH. Root keeps key login because Ansible connects as root. sshd keeps the first
# value it reads and the drop-ins load in name order, so 10- wins over the image's 50-cloud-init.conf.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
