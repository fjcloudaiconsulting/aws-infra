# Staging pods yield to everything else under memory pressure (each staging namespace's ResourceQuota allows only this
# class). Cluster-scoped, so it lives here once; on Lightsail it sits in namespaces/ziftbook-staging.yaml, which must
# drop it when ziftbook-staging moves (INFRA-173).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: staging
value: -100
preemptionPolicy: Never
description: Staging workloads, evicted before anything else on the node.
