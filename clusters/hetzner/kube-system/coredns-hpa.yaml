# CoreDNS at two replicas (INFRA-177): on 2026-10-15 its only replica was on the lost node, and cluster DNS was down for
# every pod for 6 minutes. k3s deploys CoreDNS as an addon whose manifest sets no replica count, so k3s never resets
# it, and its own topology spread puts one replica on each app node. minReplicas = maxReplicas: the HPA only holds the
# count and acts before reading any metric. During a drain or outage the second replica stays Pending (that spread
# counts db-1 as an empty node) while the other serves.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredns
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredns
  minReplicas: 2
  maxReplicas: 2
