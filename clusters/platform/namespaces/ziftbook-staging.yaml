# Staging shares the node with prod: lowest priority, so among pods over their memory request
# the kubelet evicts staging first, and it never preempts. Pods without a class get priority 0,
# so the class is negative.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: staging
value: -100
preemptionPolicy: Never
description: Staging workloads, evicted before anything else on the node.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ziftbook-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ziftbook-staging
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: ziftbook-staging
spec:
  hard:
    # backend, worker, frontend: 3 x 128Mi requests, 3 x 256Mi limits (INFRA-46). Every Deployment uses Recreate,
    # so a rollout never needs room for a second pod.
    requests.memory: 512Mi
    limits.memory: 1Gi
---
# Rejects any pod in this namespace that does not use the staging class, Job and CronJob
# pods included (they fail with a FailedCreate event only).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-class-only
  namespace: ziftbook-staging
spec:
  hard:
    pods: "0"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: [staging]
---
# Every pod here pulls private GHCR images with ghcr-pull (ziftbook-staging-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ziftbook-staging
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
