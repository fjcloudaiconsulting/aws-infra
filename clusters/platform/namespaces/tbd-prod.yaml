apiVersion: v1
kind: Namespace
metadata:
  name: tbd-prod
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tbd-prod
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: tbd-prod
spec:
  hard:
    requests.memory: 512Mi
    limits.memory: 768Mi
---
# Every pod here pulls private GHCR images with ghcr-pull (tbd-prod-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tbd-prod
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
