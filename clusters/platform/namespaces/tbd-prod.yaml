apiVersion: v1
kind: Namespace
metadata:
  name: tbd-prod
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tbd-prod
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: tbd-prod
spec:
  hard:
    requests.memory: 512Mi
    limits.memory: 768Mi
