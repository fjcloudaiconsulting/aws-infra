apiVersion: v1
kind: Namespace
metadata:
  name: tbd-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tbd-prod
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: tbd-prod
spec:
  hard:
    # backend 256/384, scheduler 160/320, frontend 128/256 (INFRA-43). Recreate everywhere: a rollout never needs a
    # second pod, and the migrate init container (96/256) is counted at the larger of init and app containers.
    requests.memory: 640Mi
    limits.memory: 1Gi
---
# Every pod here pulls private GHCR images with ghcr-pull (tbd-prod-ghcr-pull.secret.yaml), so
# workloads need no imagePullSecrets of their own. Until the secret exists the kubelet logs a
# warning and pulls anonymously; public images still work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tbd-prod
  annotations:
    # Removing this file must not make Flux delete the namespace's default account.
    kustomize.toolkit.fluxcd.io/prune: disabled
imagePullSecrets:
  - name: ghcr-pull
