# MySQL (TBD), Valkey (TBD sessions) (no backup job since INFRA-175; the unused backup-s3 Secret goes with the removal PR). Ziftbook's Postgres is on the Hetzner cluster since INFRA-181.
apiVersion: v1
kind: Namespace
metadata:
  name: data
  annotations:
    # Never deleted by Flux: pruning it would take the database volumes with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: data
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1536Mi
