# MySQL (TBD), Postgres (Ziftbook), Valkey (TBD sessions) and their backup jobs.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: data
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1536Mi
