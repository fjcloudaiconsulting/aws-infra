# TBD's MySQL. Single replica on local-path storage; nightly dumps are the backup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
  namespace: data
data:
  # Sized for the 640Mi container limit: 128M buffer pool, no performance_schema, small buffers.
  tbd.cnf: |
    [mysqld]
    performance_schema = OFF
    mysqlx = OFF
    innodb_buffer_pool_size = 128M
    innodb_log_buffer_size = 8M
    # TBD: 2 backend workers + mcp at 15 pooled connections each, plus migrate and the dump job.
    max_connections = 80
    table_open_cache = 400
    tmp_table_size = 16M
    max_heap_table_size = 16M
    character-set-server = utf8mb4
    collation-server = utf8mb4_0900_ai_ci
    # TBD-416: never wait 365 days on a metadata lock.
    lock_wait_timeout = 30
  # Runs once, on an empty datadir only. The image itself creates pfv2 and pfv_app (ALL on pfv2.*, no GRANT OPTION).
  10-backup-user.sh: |
    docker_process_sql --database=mysql <<-EOSQL
    CREATE USER 'pfv_backup'@'%' IDENTIFIED BY '${MYSQL_BACKUP_PASSWORD}';
    GRANT SELECT, LOCK TABLES, SHOW VIEW, EVENT, TRIGGER, RELOAD, PROCESS, REPLICATION CLIENT ON *.* TO 'pfv_backup'@'%';
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: data
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
# Users are created only on first boot. To rotate a password: change its key in mysql.secret.yaml, then
# `kubectl -n data exec -it mysql-0 -- mysql -uroot -p -e "ALTER USER 'pfv_app'@'%' IDENTIFIED BY '<new>'"`
# (root: ALTER USER 'root'@'localhost'), and restart the consumers (tbd-prod keeps its own copy of the app password).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # InnoDB needs time for a clean shutdown.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
          env:
            # Root only over the in-pod socket; nothing remote logs in as root.
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: root-password
            - name: MYSQL_DATABASE
              value: pfv2
            - name: MYSQL_USER
              value: pfv_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: app-password
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: backup-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The entrypoint's first-boot server has networking off, so TCP probes wait for the real one.
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [mysqladmin, ping, -h, 127.0.0.1]
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/tbd.cnf
              subPath: tbd.cnf
            - name: config
              mountPath: /docker-entrypoint-initdb.d/10-backup-user.sh
              subPath: 10-backup-user.sh
      volumes:
        - name: config
          configMap:
            name: mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
