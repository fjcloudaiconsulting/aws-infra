# Ingress to `data` is deny-by-default; egress stays open (bootstrap fetches from GitHub, backups go to S3).
# kube-router accepts anything from the node itself first (kubelet probes, but also hostNetwork pods
# such as netbird and host processes), so that path is guarded by DB auth and the NetBird ACL, not here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tbd-prod
        # INFRA-30 dump job.
        - podSelector:
            matchLabels:
              app: db-backup
      ports:
        - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tbd-prod
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ziftbook-staging
        # INFRA-30 dump job.
        - podSelector:
            matchLabels:
              app: db-backup
        # Role bootstrap Job; the label is set by the Job controller.
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: ziftbook-bootstrap
      ports:
        - port: 5432
