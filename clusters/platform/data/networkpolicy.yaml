# Ingress to `data` is deny-by-default (nothing runs here since INFRA-175).
# kube-router accepts anything from the node itself first (kubelet probes, but also hostNetwork pods
# such as netbird and host processes), so that path is guarded by DB auth and the NetBird ACL, not here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}
  policyTypes: [Ingress]
