# Staging mail sink (INFRA-47): Mailpit accepts every message from the worker and delivers nothing. No external
# account and no credentials; messages sit in an emptyDir and vanish on restart. The UI (8025) has no Ingress: read it with
# `kubectl -n ziftbook-staging port-forward svc/mailpit 8025` over NetBird.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ziftbook-staging
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
    - name: http
      port: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ziftbook-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      priorityClassName: staging
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.4
          env:
            - name: MP_DISABLE_VERSION_CHECK
              value: "true"
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: 1025
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
