# Traefik ships with k3s. Cloudflare proxies to it on 443 (the only port the Lightsail
# firewall opens, Cloudflare ranges only) in Full (strict) mode, so Traefik must serve a
# Cloudflare Origin CA certificate for every proxied hostname (INFRA-25).
# The one store Traefik reads must be named default. Its secrets live in the same namespace.
# An Origin CA cert covers one zone only, so each zone has its own: origin-cert (thebetterdecision.com,
# also the default) and origin-cert-ziftbook (ziftbook.com, INFRA-47); Traefik picks by SNI.
# Until a secret exists Traefik logs an error and serves the default; nothing else breaks.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: origin-cert
  certificates:
    - secretName: origin-cert-ziftbook
---
# ping.thebetterdecision.com/ping answers 200 from Traefik itself (no pod): the end-to-end
# check that Cloudflare reaches the node in Full (strict), and the target of the external
# uptime check (INFRA-26).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ping
  namespace: kube-system
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ping.thebetterdecision.com`) && Path(`/ping`)
      kind: Rule
      services:
        - name: ping@internal
          kind: TraefikService
---
# Authenticated Origin Pulls (INFRA-93): only Cloudflare, presenting our zone-level client certificate
# (terraform/cloudflare/origin_pull.tf), completes a TLS handshake. Any other client fails it, including another
# Cloudflare account's zone pointed at the node. Named default, so it applies to every router that names no
# TLSOption (all of ours, in every namespace). Fails OPEN, silently: a second TLSOption named default anywhere
# (Traefik drops both), a router with its own tls.options, or entrypoint-level TLS options. Fails CLOSED for every
# host: a listed origin-pull-ca-<gen> Secret missing (same namespace, key ca.crt), or no active certificate at
# Cloudflare. tests/test_origin_pull.py guards the repo side. Rollback and rotation: docs/runbooks.md.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: kube-system
spec:
  minVersion: VersionTLS12
  clientAuth:
    secretNames:
      - origin-pull-ca-1
    clientAuthType: RequireAndVerifyClientCert
