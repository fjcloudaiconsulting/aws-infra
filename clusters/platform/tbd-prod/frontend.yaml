# TBD web (Next.js standalone) in production (INFRA-43). Replicas stay 0 while TBD runs on DigitalOcean; the
# INFRA-48 cutover window sets them to 1 and adds the app.thebetterdecision.com IngressRoute (docs/tbd-cutover.md).
# Config is runtime-only since INFRA-40 (lib/runtime-config.ts reads TBD_* per request); the values below mirror
# the DigitalOcean frontend component. Image tag v0.0.0 is a placeholder (see backend.yaml); production bumps
# arrive as Renovate PRs and never automerge (renovate.json).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tbd-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tbd-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001 # nextjs in the image; runAsNonRoot cannot check a named user
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/fjcloudaiconsulting/tbd/frontend:v0.291.1
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            # Server-side (RSC) fetches reach the backend directly; browsers use relative URLs through Traefik.
            - name: BACKEND_INTERNAL_URL
              value: http://backend:8000
            # Access-log client IP, same rule and value as backend.yaml (INFRA-97). Trustworthy because Traefik requires
            # our zone's Authenticated Origin Pulls cert (INFRA-93). Images before the INFRA-97 tbd release ignore it.
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            # Exactly "true" shows "Sign in with Google" on /login and /register.
            - name: TBD_GOOGLE_SSO_ENABLED
              value: "true"
            # Turnstile site key (public), checked by the backend against CAPTCHA_EXPECTED_HOSTNAME.
            - name: TBD_CAPTCHA_SITE_KEY
              value: "0x4AAAAAADTu1HIFconXLShc"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
