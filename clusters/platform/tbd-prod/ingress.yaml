# app.thebetterdecision.com (INFRA-48): Cloudflare (proxied, Full strict) to Traefik, with these routes: /api, /health, /ready and the two
# OAuth discovery prefixes (INFRA-147; /api/v1/oauth is under /api) go to the backend, everything else, the
# /oauth/authorize consent page included, to the frontend. No MCP service runs in prod yet, so /mcp is the frontend's 404. Traefik
# tries the longer rule first, so the backend route wins for its prefixes. The default TLS store's origin-cert covers
# *.thebetterdecision.com. The hostname is unreachable until the Cloudflare record points here (terraform/cloudflare).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: tbd-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.thebetterdecision.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/ready`) ||
        PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/oauth-protected-resource`))
      kind: Rule
      services:
        - name: backend
          port: 8000
    - match: Host(`app.thebetterdecision.com`)
      kind: Rule
      services:
        - name: frontend
          port: 3000
