# app.thebetterdecision.com (INFRA-48): Cloudflare (proxied, Full strict) to Traefik, with these routes: /api, /health and /ready go to the backend, everything else to the frontend. Traefik
# tries the longer rule first, so the backend route wins for its prefixes. The default TLS store's origin-cert covers
# *.thebetterdecision.com. The hostname is unreachable until the Cloudflare record points here (terraform/cloudflare).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: tbd-prod
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.thebetterdecision.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/ready`))
      kind: Rule
      services:
        - name: backend
          port: 8000
    - match: Host(`app.thebetterdecision.com`)
      kind: Rule
      services:
        - name: frontend
          port: 3000
