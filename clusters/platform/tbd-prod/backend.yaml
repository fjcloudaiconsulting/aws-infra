# TBD API in production (INFRA-43). Replicas stay 0 while TBD runs on DigitalOcean; the INFRA-48 cutover window
# sets them to 1 after the data restore (docs/tbd-cutover.md). Secret tbd: tbd.secret.yaml, written by the owner.
# The migrate init container (the `migrations` image target, INFRA-39) runs `python /app/scripts/migrate.py`
# (alembic upgrade head) before every start, so a new version never serves on an old schema. A Job named by
# version cannot work under Flux (immutable pod template, no ordering before Deployments). Only this pod migrates;
# alembic env.py takes a MySQL GET_LOCK (INFRA-83), so a second migrator would wait, then find the work done.
# Images track vX.Y.Z only. Production bumps arrive as PRs and never automerge (renovate.json: the staging
# automerge rule matches ziftbook-staging paths only). Tag v0.0.0 is a placeholder: before the cutover it becomes
# the first tbd release that carries both INFRA-42 (tbd#823) and INFRA-83 (tbd#824); bump backend, migrations,
# scheduler and frontend together.
# The scheduler loop is disabled here: it runs in scheduler.yaml (exactly one pod).
# PFV_RUNTIME is deliberately unset (DigitalOcean only). CLIENT_IP_HEADER=cf-connecting-ip: Cloudflare overwrites that
# header, and Traefik requires our zone's Authenticated Origin Pulls cert (INFRA-93), so only our zone reaches the
# origin and get_client_ip reads the visitor from it (INFRA-83). frontend.yaml sets the same value (INFRA-97).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tbd-prod
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tbd-prod
spec:
  replicas: 1
  # Recreate: no surge pod, so a rollout never exceeds the namespace quota or opens a second DB pool.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1001 # backend in the image; runAsNonRoot cannot check a named user
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/fjcloudaiconsulting/tbd/migrations:v0.292.1
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: redis-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: jwt-secret-key
            - name: API_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: api-token-hmac-key
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/fjcloudaiconsulting/tbd/backend:v0.292.1
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            - name: LOG_LEVEL
              value: "INFO"
            - name: APP_URL
              value: "https://app.thebetterdecision.com"
            - name: BACKEND_CORS_ORIGINS
              value: "https://app.thebetterdecision.com,https://thebetterdecision.com,https://www.thebetterdecision.com"
            - name: COOKIE_SECURE
              value: "true"
            - name: MAILGUN_DOMAIN
              value: "m.thebetterdecision.com"
            - name: MAILGUN_REGION
              value: "eu"
            - name: EMAIL_FROM
              value: "The Better Decision <noreply@m.thebetterdecision.com>"
            - name: AI_NATIVE_ENABLED
              value: "false"
            - name: AI_DISPATCH_TIMEOUT_S
              value: "30"
            - name: AI_NATIVE_CURRENT_CONSENT_VERSION
              value: "ai-tos-2026-05-22"
            - name: CAPTCHA_REQUIRED
              value: "true"
            - name: CAPTCHA_PROVIDER
              value: "turnstile"
            - name: CAPTCHA_VERIFY_URL
              value: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
            - name: CAPTCHA_VERIFY_TIMEOUT_S
              value: "5"
            - name: CAPTCHA_VERIFY_TOTAL_TIMEOUT_S
              value: "20"
            - name: CAPTCHA_EXPECTED_HOSTNAME
              value: "app.thebetterdecision.com"
            - name: CAPTCHA_EXPECTED_ACTION
              value: "register"
            - name: BILLING_UI_ENABLED
              value: "false"
            - name: FEATURE_REPORTS_V2
              value: "true"
            - name: FEATURE_PLANS
              value: "false"
            - name: FEATURE_CUSTOM_DASHBOARD
              value: "true"
            - name: SCHEDULER_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: redis-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: jwt-secret-key
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mfa-encryption-key
            - name: AI_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: ai-credential-encryption-key
            - name: AI_CREDENTIAL_ENCRYPTION_KEY_PREV
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: ai-credential-encryption-key-prev
                  optional: true
            - name: API_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: api-token-hmac-key
            - name: MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mailgun-api-key
            - name: MAILGUN_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: mailgun-webhook-signing-key
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: google-client-secret
            - name: CAPTCHA_SECRET
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: captcha-secret
            - name: FOUNDER_COUNT_EXCLUDE_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: tbd
                  key: founder-count-exclude-usernames
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi # near the working set, so staging (over its request sooner) is evicted first
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
